<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Móvil | Joyas Neny</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/joyas-neny-favicon.png?v=3.1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal-blue': '#162C6D',
                        'royal-dark': '#0A163B',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        }
        /* Realistic Phone Frame */
        .phone-mockup {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 0 12px #262626,
                0 0 0 14px #404040,
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(22, 44, 109, 0.25);
        }
        .phone-screen {
            border-radius: 40px;
            overflow: hidden;
            background: #ffffff;
        }
        /* Dynamic Island */
        .dynamic-island {
            width: 110px;
            height: 28px;
            background: #000000;
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .camera-lens {
            width: 10px;
            height: 10px;
            background: #111827;
            border-radius: 50%;
            border: 1.5px solid #1f2937;
        }
        .speaker-sensor {
            width: 8px;
            height: 8px;
            background: #030712;
            border-radius: 50%;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between select-none">

    <!-- Top Control Bar -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- Brand & Info -->
            <div class="flex items-center gap-3">
                <img src="img/joyas-neny-favicon.png?v=3.1.0" alt="Logo" class="w-8 h-8 object-contain">
                <div>
                    <h1 class="text-sm font-bold text-white tracking-wide">Simulador Responsive Móvil</h1>
                    <p class="text-[11px] text-slate-400">Joyería & Relojería Neny</p>
                </div>
            </div>

            <!-- Controls Group -->
            <div class="flex flex-wrap items-center gap-3">
                
                <!-- Page Switcher -->
                <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 text-xs">
                    <button id="btnPageHome" onclick="setPage('index.html')" class="px-3.5 py-1.5 rounded-lg font-medium transition-all bg-royal-blue text-white shadow-sm">
                        🏠 Inicio
                    </button>
                    <button id="btnPageCatalog" onclick="setPage('catalogo.html')" class="px-3.5 py-1.5 rounded-lg font-medium transition-all text-slate-300 hover:text-white">
                        ⌚ Catálogo
                    </button>
                </div>

                <!-- Device Presets -->
                <div class="flex items-center bg-slate-800/80 rounded-xl border border-slate-700/60 text-xs p-1">
                    <button onclick="setDevice(393, 852, 'iPhone 15 Pro')" class="device-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-white" data-device="iPhone 15 Pro">
                        iPhone 15 Pro
                    </button>
                    <button onclick="setDevice(412, 915, 'Galaxy S24')" class="device-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white" data-device="Galaxy S24">
                        Galaxy S24
                    </button>
                    <button onclick="setDevice(375, 667, 'iPhone SE')" class="device-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white" data-device="iPhone SE">
                        iPhone SE
                    </button>
                    <button onclick="setDevice(768, 1024, 'Tablet Mini')" class="device-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white" data-device="Tablet Mini">
                        Tablet (768px)
                    </button>
                </div>

                <!-- Rotate Orientation -->
                <button onclick="toggleOrientation()" title="Rotar pantalla" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700/60 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>

                <!-- Refresh iframe -->
                <button onclick="reloadPreview()" title="Recargar vista" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700/60 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                </button>

                <!-- Open in new tab -->
                <a id="openTabLink" href="index.html" target="_blank" title="Abrir en pestaña completa" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl border border-slate-700/60 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
            </div>

            <!-- Current Resolution Badge -->
            <div class="hidden lg:flex items-center gap-2 text-xs text-slate-400 bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="resBadge">393 × 852 px</span>
            </div>

        </div>
    </header>

    <!-- Main Viewport Area -->
    <main class="flex-1 flex items-center justify-center p-6 sm:p-10 overflow-auto">
        <div id="phoneWrapper" class="phone-mockup relative bg-black rounded-[52px] p-3 transition-all duration-300">
            
            <!-- Dynamic Island Notch -->
            <div id="dynamicIsland" class="dynamic-island">
                <div class="camera-lens"></div>
                <div class="speaker-sensor"></div>
            </div>

            <!-- Screen / iFrame Container -->
            <div id="screenContainer" class="phone-screen relative shadow-inner" style="width: 393px; height: 852px;">
                <iframe id="previewIframe" src="index.html?v=3.6.0" class="w-full h-full border-0" loading="eager"></iframe>
            </div>

        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="w-full text-center py-3 text-xs text-slate-500 border-t border-slate-800/80 bg-slate-900/40">
        Simulador interactivo en tiempo real • Puedes interactuar con la página, presionar botones, navegar el catálogo y probar el menú hamburguesa.
    </footer>

    <!-- Interactive Simulator Script -->
    <script>
        let currentWidth = 393;
        let currentHeight = 852;
        let isLandscape = false;
        let currentPage = 'index.html';

        const screenContainer = document.getElementById('screenContainer');
        const previewIframe = document.getElementById('previewIframe');
        const resBadge = document.getElementById('resBadge');
        const dynamicIsland = document.getElementById('dynamicIsland');
        const openTabLink = document.getElementById('openTabLink');
        const btnPageHome = document.getElementById('btnPageHome');
        const btnPageCatalog = document.getElementById('btnPageCatalog');

        function setDevice(w, h, name) {
            currentWidth = w;
            currentHeight = h;
            
            // Highlight active device button
            document.querySelectorAll('.device-btn').forEach(btn => {
                if (btn.dataset.device === name) {
                    btn.className = 'device-btn px-3 py-1.5 rounded-lg font-medium bg-slate-700 text-white';
                } else {
                    btn.className = 'device-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white';
                }
            });

            // Adjust dynamic island visibility for tablets
            if (w >= 768) {
                dynamicIsland.classList.add('hidden');
            } else {
                dynamicIsland.classList.remove('hidden');
            }

            applyDimensions();
        }

        function toggleOrientation() {
            isLandscape = !isLandscape;
            applyDimensions();
        }

        function applyDimensions() {
            const w = isLandscape ? Math.max(currentWidth, currentHeight) : Math.min(currentWidth, currentHeight);
            const h = isLandscape ? Math.min(currentWidth, currentHeight) : Math.max(currentWidth, currentHeight);

            screenContainer.style.width = w + 'px';
            screenContainer.style.height = h + 'px';

            resBadge.textContent = `${w} × ${h} px ${isLandscape ? '(Horizontal)' : '(Vertical)'}`;
        }

        function setPage(page) {
            currentPage = page;
            previewIframe.src = page + '?v=3.1.0';
            openTabLink.href = page;

            if (page === 'index.html') {
                btnPageHome.className = 'px-3.5 py-1.5 rounded-lg font-medium transition-all bg-royal-blue text-white shadow-sm';
                btnPageCatalog.className = 'px-3.5 py-1.5 rounded-lg font-medium transition-all text-slate-300 hover:text-white';
            } else {
                btnPageCatalog.className = 'px-3.5 py-1.5 rounded-lg font-medium transition-all bg-royal-blue text-white shadow-sm';
                btnPageHome.className = 'px-3.5 py-1.5 rounded-lg font-medium transition-all text-slate-300 hover:text-white';
            }
        }

        function reloadPreview() {
            previewIframe.src = currentPage + '?v=' + Date.now();
        }
    </script>
</body>
</html>
